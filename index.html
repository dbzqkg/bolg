<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>宫商角徵的个人博客</title>
  <link rel="stylesheet" href="style.css?v=2" />
  <link rel="icon" href="data:," />
</head>
<body>
  <!-- 波普漫画风开始页面 -->
  <div id="landing">
    <!-- 半调网点背景 -->
    <div class="landing-bg"></div>
    <!-- 主标题 -->
    <div class="landing-title">
      <h1>「<span class="title-accent">宫商角徵</span>」<br/>的个人博客</h1>
    </div>
    <!-- 提示文字 -->
    <div class="landing-hint">
      <div class="hint-arrow">▲</div>
      <span>点击任意处开始探索</span>
    </div>
    <!-- 漫画速度线装饰 -->
    <div class="speed-lines speed-lines-left"></div>
    <div class="speed-lines speed-lines-right"></div>
  </div>

  <div id="bg"></div>

  <!-- 3D 场景：CSS 3D 空间 -->
  <div id="scene">
    <div id="ring-world">
      <!-- 中心图片（z-index 固定中间层） -->
      <div id="center-image"></div>
      <!-- 选项卡片（由 JS 动态生成） -->
      <div id="ring"></div>
    </div>
  </div>

  <!-- 右下角展开面板 -->
  <div id="info-toggle"></div>
  <div id="info-panel">
    <div class="panel-close"></div>
    <div class="panel-icon"></div>
    <div class="panel-title"></div>
    <div class="panel-content"></div>
  </div>

  <!-- 页面覆盖层 -->
  <div id="page-overlay">
    <div class="overlay-close"></div>
    <div class="overlay-title-wrap">
      <h1 class="overlay-title"></h1>
      <p class="overlay-subtitle"></p>
    </div>
    <div class="overlay-img">
      <img src="" alt="" />
    </div>
  </div>

  <!-- GSAP 核心动画库 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="config.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
