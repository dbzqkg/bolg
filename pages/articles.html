<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>文章 - 宫商角徵的个人博客</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #f0f0eb;
    }

    /* 返回按钮 */
    .back-btn {
      position: fixed;
      top: 24px; left: 24px;
      z-index: 100;
      width: 48px; height: 48px;
      background: #fff;
      border: 4px solid #000;
      box-shadow: 4px 4px 0 #000;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      text-decoration: none;
    }
    .back-btn:hover {
      transform: scale(1.1);
      box-shadow: 6px 6px 0 #000;
    }
    .back-btn::before, .back-btn::after {
      content: ''; position: absolute;
      width: 18px; height: 3px;
      background: #000; border-radius: 2px;
    }
    .back-btn::before {
      transform: translate(-3px, 0) rotate(45deg);
    }
    .back-btn::after {
      transform: translate(-3px, 0) rotate(-45deg);
    }

    /* 右侧图片 */
    .read-container {
      position: fixed;
      right: 5%;
      top: 50%;
      transform: translateY(-50%) scale(1.1);
      max-height: 85vh;
      animation: slide-in 0.6s ease-out both;
    }
    .read-container img {
      display: block;
      max-width: 70vw;
      max-height: 85vh;
      object-fit: contain;
    }

    @keyframes slide-in {
      from {
        opacity: 0;
        transform: translateY(-50%) translateX(80px);
      }
      to {
        opacity: 1;
        transform: translateY(-50%) translateX(0);
      }
    }

    /* 左侧标题 */
    .page-title {
      position: fixed;
      left: 10%;
      top: 50%;
      transform: translateY(-50%);
      animation: fade-in 0.8s ease-out both;
      animation-delay: 0.3s;
    }
    .page-title h1 {
      font-size: clamp(32px, 6vw, 64px);
      font-weight: 900;
      color: #000;
      -webkit-text-stroke: 1.5px #000;
      text-shadow:
        3px 3px 0 #ff3030,
        6px 6px 0 rgba(255, 48, 48, 0.2);
      letter-spacing: 6px;
    }
    .page-title p {
      margin-top: 16px;
      font-size: 16px;
      font-weight: 700;
      color: #555;
      letter-spacing: 2px;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(-50%) translateX(-40px); }
      to { opacity: 1; transform: translateY(-50%) translateX(0); }
    }

    /* 半调网点装饰 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle, #e0e0d8 1px, transparent 1px);
      background-size: 16px 16px;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <a href="../index.html" class="back-btn"></a>

  <div class="page-title">
    <h1>文章</h1>
    <p>阅读与记录</p>
  </div>

  <div class="read-container">
    <img src="../assets/img/teto-read.png" alt="阅读" />
  </div>
</body>
</html>
